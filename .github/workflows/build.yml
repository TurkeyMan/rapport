name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Every backend, as plugins and statically linked (one GTK at a time: a
  # program can only hold one), with the examples and the shell probe. The
  # asan job is the plugin build with AddressSanitizer (RAPPORT_ASAN), the
  # same tests: a use after free fails the test it's in. Leaks aren't
  # checked (GTK, fontconfig and Qt keep theirs till exit).
  linux:
    name: debian ${{ matrix.link }}
    runs-on: ubuntu-24.04
    container: 'debian:trixie'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { link: plugins, flags: '' }
          - { link: static,  flags: '-DRAPPORT_STATIC=ON -DRAPPORT_BACKEND_GTK4=OFF' }
          - { link: asan,    flags: '-DCMAKE_BUILD_TYPE=RelWithDebInfo -DRAPPORT_ASAN=ON',
              asan_options: 'detect_leaks=0:abort_on_error=0:halt_on_error=1' }
    env:
      ASAN_OPTIONS: ${{ matrix.asan_options }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build g++ \
            pkg-config libgtk-3-dev libgtk-4-dev qt6-base-dev wayland-protocols \
            glslang-tools libvulkan-dev

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRAPPORT_REQUIRE_BACKENDS=ON ${{ matrix.flags }} | tee configure.log
          # GTK 3 reads the true fractional scale only with wayland-protocols.
          grep -q 'GTK 3 fractional scale: on' configure.log
          cmake --build build --parallel "$(nproc)"

      - name: Shell probe
        run: build/bin/rapport-shell-example-probe --extended .

      - name: Portable tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # Synthesized input through the real backends, off any desktop: GTK 3
      # on a Broadway server, Qt on its offscreen platform; GTK 4's entry
      # buttons through focus and activate, on its own Broadway server.
      # (Plugins and asan: the tests load the backends.) A GTK critical fails
      # the test it's in; GTK 4's document tabs fail on any GTK warning.
      - name: List input
        if: matrix.link != 'static'
        run: |
          apt-get install -y --no-install-recommends libgtk-3-bin libgtk-4-bin
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export G_DEBUG=fatal-criticals
          broadwayd :5 & gtk4-broadwayd :7 & sleep 1
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-list-input-test-gtk3
          QT_QPA_PLATFORM=offscreen RAPPORT_NO_ACTIVATE=1 build/bin/rapport-list-input-test-qt6
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-back-forward-test-gtk3
          QT_QPA_PLATFORM=offscreen RAPPORT_NO_ACTIVATE=1 build/bin/rapport-back-forward-test-qt6
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-entry-buttons-test-gtk4
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-document-tabs-test-gtk3
          G_DEBUG=fatal-warnings GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-document-tabs-test-gtk4
          QT_QPA_PLATFORM=offscreen RAPPORT_NO_ACTIVATE=1 build/bin/rapport-document-tabs-test-qt6
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_BACKEND=gtk3 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-document-tabs-tearoff-test-gtk3
          G_DEBUG=fatal-warnings GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_BACKEND=gtk4 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-document-tabs-tearoff-test-gtk4
          QT_QPA_PLATFORM=offscreen RAPPORT_BACKEND=qt6 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-document-tabs-tearoff-test-qt6
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-stack-test-gtk3
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-stack-test-gtk4
          QT_QPA_PLATFORM=offscreen RAPPORT_NO_ACTIVATE=1 build/bin/rapport-stack-test-qt6
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-splitter-moved-test-gtk3
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-splitter-moved-test-gtk4
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-on-destroyed-test-gtk3
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-on-destroyed-test-gtk4
          QT_QPA_PLATFORM=offscreen RAPPORT_NO_ACTIVATE=1 build/bin/rapport-on-destroyed-test-qt6
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-present-test-gtk3
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-present-test-gtk4
          QT_QPA_PLATFORM=offscreen RAPPORT_NO_ACTIVATE=1 build/bin/rapport-present-test-qt6
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-setters-quiet-test-gtk3
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 RAPPORT_NO_ACTIVATE=1 build/bin/rapport-setters-quiet-test-gtk4
          QT_QPA_PLATFORM=offscreen RAPPORT_NO_ACTIVATE=1 build/bin/rapport-setters-quiet-test-qt6

  # MSVC with the static runtime, as the apps ship: as plugins and statically
  # linked. The examples must run, and the shell extension must load into
  # Explorer's way of calling it and need nothing but Windows. Server 2022 is
  # build 20348, below Windows 11's 22000, so what's gated on Windows 11 runs
  # only on Server 2025 (build 26100). The asan job is Server 2025's plugin
  # build with AddressSanitizer (RAPPORT_ASAN): the same tests, run there so
  # what's Windows 11's (the band, its glass) is in them too.
  windows:
    name: windows msvc ${{ matrix.link }}${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { link: plugins, flags: '',                    os: windows-2022, tag: '' }
          - { link: static,  flags: '-DRAPPORT_STATIC=ON', os: windows-2022, tag: '' }
          - { link: plugins, flags: '',                    os: windows-2025, tag: ' (build 26100)' }
          - { link: asan,    flags: '-DRAPPORT_ASAN=ON',   os: windows-2025, tag: ' (build 26100)' }
    steps:
      - uses: actions/checkout@v4

      - name: Windows build
        run: |
          $b = [int](Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber
          "Windows build $b"
          if ('${{ matrix.os }}' -eq 'windows-2025' -and $b -lt 22000) { throw "expected build 22000 or later, got $b" }

      - name: Build
        run: |
          # Server 2025's image has a newer Visual Studio than 2022: CMake
          # picks the newest there.
          $gen = if ('${{ matrix.os }}' -eq 'windows-2022') { @('-G', 'Visual Studio 17 2022') } else { @() }
          cmake -S . -B build @gen -A x64 `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" ${{ matrix.flags }}
          cmake --build build --config Release --parallel

      - name: Gallery snapshot
        working-directory: build/bin/Release
        run: |
          $env:RAPPORT_SNAPSHOT = "$env:RUNNER_TEMP\gallery.png"
          $env:RAPPORT_SNAPSHOT_DELAY = "500"
          $p = Start-Process .\rapport-gallery.exe -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path $env:RAPPORT_SNAPSHOT)) { throw "rapport-gallery didn't snapshot" }

      # The document tabs' strip, light and dark, narrowed and scrolling, and
      # the toolbar band under it (one of each control, at both densities:
      # RAPPORT_DENSITY): to look at, as no test can.
      - name: Document tabs snapshots
        working-directory: build/bin/Release
        run: |
          foreach ($theme in 'light', 'dark') {
            foreach ($density in 'standard', 'compact') {
              $env:RAPPORT_THEME = $theme
              $env:RAPPORT_DENSITY = $density
              $name = if ($density -eq 'standard') { "document-tabs-$theme" } else { "document-tabs-$theme-$density" }
              $env:RAPPORT_SNAPSHOT = "$env:RUNNER_TEMP\$name.png"
              $p = Start-Process .\rapport-document-tabs.exe -ArgumentList '--many' -PassThru -Wait
              if ($p.ExitCode -ne 0 -or -not (Test-Path $env:RAPPORT_SNAPSHOT)) { throw "rapport-document-tabs didn't snapshot ($theme, $density)" }
            }
          }
          Remove-Item Env:RAPPORT_THEME
          Remove-Item Env:RAPPORT_DENSITY

      # Server 2025's runner also runs the base surface, caption tabs and
      # band fields tests under high contrast (win32-base-surface-high-contrast,
      # win32-caption-tabs-high-contrast, win32-band-fields-high-contrast),
      # and the caption tabs and band fields with the display's scale (and
      # the tabs' high contrast) changed while they're open
      # (win32-caption-tabs-transitions, win32-band-fields-transitions):
      # system settings, so only on a throwaway runner, and only its jobs.
      # Every Windows job drives the document tabs' dragging out and
      # dropping with real input (SendInput: shown windows, the desktop's
      # z-order), win32-document-tabs-tearoff-input, as it moves the pointer
      # and presses keys: only on a runner. So does window::present's
      # (win32-present, win32-present-activate), which shows, minimises and
      # restores windows, and a toolbar's keyboard (win32-toolbar-keyboard),
      # which moves the focus.
      - name: Portable tests
        env:
          RAPPORT_TEST_SET_HIGH_CONTRAST: ${{ matrix.os == 'windows-2025' && '1' || '0' }}
          RAPPORT_TEST_SET_DPI: ${{ matrix.os == 'windows-2025' && '1' || '0' }}
          RAPPORT_TEST_SEND_INPUT: '1'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Shell extension
        working-directory: build/bin/Release
        run: |
          .\rapport-explorer-probe.exe rapport-shell-example.dll "{6B1D3F0E-8C2A-4E57-9A41-2F5C7D90B3E8}" --extended $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE) { throw 'rapport-explorer-probe failed' }

      # Our own DLLs beside them (the plugin build's core and backends) are
      # fine; any runtime isn't. The shell extension may need nothing at all.
      - name: Imports
        if: matrix.link != 'asan'
        run: |
          python ci/check-imports.py --allow-beside (Get-ChildItem build/bin/Release/*.exe, build/bin/Release/*.dll)
          if ($LASTEXITCODE) { throw 'a runtime DLL is imported' }
          python ci/check-imports.py build/bin/Release/rapport-shell-example.dll
          if ($LASTEXITCODE) { throw 'the shell extension imports a DLL Explorer won''t find' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-${{ matrix.link }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gallery.png
            ${{ runner.temp }}/document-tabs-*.png
          if-no-files-found: ignore
